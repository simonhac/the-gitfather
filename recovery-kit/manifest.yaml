    checksum: ftp.postgresql.org .sha256
  # Dumps are pg_dump's custom format (-Fc), which gzip-compresses its contents by default: a
  # pg_restore built without zlib cannot read them.
  - path: postgres/zlib-1.3.2.tar.gz
    name: zlib source (pg_restore needs it to read compressed dumps)
    version: 1.3.2
    url: https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
    sha256: bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16
    checksum: GitHub release asset digest
  # Since PostgreSQL 17 the source tarball no longer carries its generated parsers, so building it
  # needs bison and flex (and Perl, which every Unix has), and both of those need m4. Each of the
  # three builds with ./configure && make.
  - path: postgres/m4-1.4.21.tar.gz
