  # ── PostgreSQL: pg_restore turns a .dump back into a database ───────────────────────────────────────
  - path: postgres/postgresql-17.11.tar.gz
    name: PostgreSQL source
    version: "17.11"
    url: https://ftp.postgresql.org/pub/source/v17.11/postgresql-17.11.tar.gz
