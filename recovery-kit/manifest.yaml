# The RECOVERY KIT manifest — every artifact a stranger needs to open the backups years from now,
# pinned by version and SHA-256. `npm run recovery-kit -- build` fetches each one, refuses any whose
# bytes don't match, and assembles the kit; see docs/key-escrow.md#the-recovery-kit.
#
# What belongs here is what RECOVERY needs, not what runs the backups: nobody opening a backup in ten
# years needs tsx, zod or the scheduler Worker. Not here on purpose: rclone (R2 speaks plain S3, so any
# S3 client fetches the objects) and this repo (the kit's README walks the no-repo path).
#
# BUMPING an artifact: change `version`, `url` and `path` together, then take the new `sha256` from
# a source you trust independently of the download itself, and write down which one in `checksum`:
#   - PyPI:       https://pypi.org/pypi/<package>/<version>/json → urls[].digests.sha256
#   - age:        the release's asset digests: gh api repos/FiloSottile/age/releases/tags/<tag>
#   - zstd:       the release's <file>.sha256 asset
#   - PostgreSQL: https://ftp.postgresql.org/pub/source/v<version>/<file>.sha256
#   - specs:      pin `url` to a commit, never a branch; hash the file you reviewed
# shamir-mnemonic stays at the version CI tests against (.github/workflows/ci.yml); bump both together.
# PostgreSQL's major must be at least every profile's `dump.client-major` (default 17): pg_restore
# refuses a dump from a newer pg_dump. Then run `build`, `upload` and `verify`, and an offline drill.

artifacts:
  # ── SLIP-39: the standard the key cards are written in ────────────────────────────────────────────
  # With the spec and its word list, a person can rebuild a split key by hand even if every
  # implementation has gone.
  - path: slip39/slip-0039.md
    name: SLIP-39 specification
    version: satoshilabs/slips@78c87bc
    url: https://raw.githubusercontent.com/satoshilabs/slips/78c87bc63ba1e4479dad7ffd3b18584430d8efb6/slip-0039.md
    sha256: 7b4269f66f10f03ac685ea7c76f742bfbf56211af1af29339eadef9acba1f856
    checksum: hashed at review
  - path: slip39/wordlist.txt
    name: SLIP-39 word list (1,024 words)
    version: satoshilabs/slips@78c87bc
    url: https://raw.githubusercontent.com/satoshilabs/slips/78c87bc63ba1e4479dad7ffd3b18584430d8efb6/slip-0039/wordlist.txt
    sha256: bcc4555340332d169718aed8bf31dd9d5248cb7da6e5d355140ef4f1e601eec3
    checksum: hashed at review; byte-identical to the list inside the shamir-mnemonic wheel

  # ── Python: the reference code that turns the cards back into a key ─────────────────────────────────
  # Wheels, not sdists: a pure-Python wheel installs with `pip install --no-index` and no build
  # backend, which an sdist would have to download. A wheel is a zip of the .py source, so it is the
  # source too. click is only for the `shamir` command-line tool (`shamir-mnemonic[cli]`).
  - path: python/shamir_mnemonic-0.3.0-py3-none-any.whl
    name: shamir-mnemonic (SLIP-39 reference implementation)
    version: 0.3.0
    url: https://files.pythonhosted.org/packages/1d/38/2124e565afe40993949dbc89da6c654a2c9a1b24dd80039812ef7cdbaef3/shamir_mnemonic-0.3.0-py3-none-any.whl
    sha256: 188c6b5bd00d5e756e12e2b186c3cb7c98ff7ff44df608d4c1d2077f6b6e730f
    checksum: PyPI
  - path: python/bech32-1.2.0-py3-none-any.whl
    name: bech32 (BIP-173 reference implementation)
    version: 1.2.0
    url: https://files.pythonhosted.org/packages/b6/41/7022a226e5a6ac7091a95ba36bad057012ab7330b9894ad4e14e31d0b858/bech32-1.2.0-py3-none-any.whl
    sha256: 990dc8e5a5e4feabbdf55207b5315fdd9b73db40be294a19b3752cde9e79d981
    checksum: PyPI
  - path: python/click-8.5.0-py3-none-any.whl
    name: click (for the shamir command-line tool)
    version: 8.5.0
    url: https://files.pythonhosted.org/packages/58/50/6c0d534c5f134586a8e1ba4e330569e32f057e33372ae556463212fb4cd3/click-8.5.0-py3-none-any.whl
    sha256: 255bc9599cf7748b4b1a446ccc735421bd08a2ae529a8b88597d3de5664ee360
    checksum: PyPI

