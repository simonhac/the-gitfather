name: pg-durable-verify (reusable)

# Reusable DAILY durable-tier verification — guarantees every daily/weekly/monthly object is
# integrity-tested at least once. PRIMARY: hash-check each durable object against the SHA-256
# recorded at backup time + full-restore the freshest daily. SECONDARY: full-restore the newest
# weekly/monthly object ≥ verify-durable.retest-days old not yet restore-verified. Replaces the standalone weekly
# pg-restore-drill in the recommended caller wiring. Cadence/limits come from the profile
# (verify-durable.fresh / verify-durable.aged / verify-durable.retest-days / verify-durable.max-restores). See docs/verify-and-restore.md.

on:
  workflow_call:
    inputs:
      profile:
        description: "Path (within the CALLER repo) to the profile .yaml."
        type: string
        required: true
      gitfather_ref:
        type: string
        required: false
        default: main
      r2_bucket:
        description: "Private R2 dump bucket name (caller passes vars.R2_BUCKET)."
        type: string
        required: true
      notify_url:
        description: >-
          The scheduler's /notify URL (caller passes vars.GITFATHER_NOTIFY_URL). The job's last step
          POSTs it so the run is announced in Slack within seconds; empty → the scheduler's reconcile
          tick posts the run within ~10 min instead.
        type: string
        required: false
        default: ""
      slack_channel:
        description: "DEPRECATED — ignored; remove from your caller. Kept only so callers that still pass it don't fail validation."
        type: string
        required: false
        default: ""
      pg_service_image:
        description: "Postgres image the drill restores INTO — must be >= your server's major (e.g. postgres:18). Restoring a dump into an OLDER server is unsupported."
        type: string
        required: false
        default: "postgres:17"
    # Secrets passed EXPLICITLY by the caller (inherit only works same-org/enterprise; this repo is
    # owned by a different account than its consumers). Non-secret config is threaded via inputs.
    secrets:
      # Read-only, and used ONLY as the live row-count reference for a restore. Optional because
      # verify-durable.keyless never restores, and a job that cannot use a production database
      # credential should not be handed one. The profile's own validation is the real gate: without
      # `keyless` the schema requires PG_LIVE_DATABASE_URL and the run fails before doing anything.
      PG_BACKUP_DATABASE_URL:
        required: false
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      SLACK_BOT_TOKEN:
        description: "DEPRECATED — ignored; remove from your caller. Kept only so callers that still pass it don't fail validation."
        required: false
      AGE_IDENTITY:             # only if backups are .age-encrypted
        required: false
      ALERT_WEBHOOK_URL:
        description: "DEPRECATED — ignored; remove from your caller. Kept only so callers that still pass it don't fail validation."
        required: false
      VERIFY_HEARTBEAT_URL:     # optional dead-man's-switch, pinged only on a CLEAN verify
        required: false         # DISTINCT from the backup's HEARTBEAT_URL on purpose — they guard
                                # different failures (a backup not landing vs one that will not
                                # restore) and one caller repo can hold both. Sharing a name would
                                # let a green backup silence a broken restore.

jobs:
  verify-durable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      pg:
        image: ${{ inputs.pg_service_image }}
        env:
          POSTGRES_PASSWORD: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout caller repo (holds the profile)
        uses: actions/checkout@v4
        with:
          path: caller

      - name: Checkout the-gitfather (holds the scripts)
        uses: actions/checkout@v4
        with:
          repository: simonhac/the-gitfather
          ref: ${{ inputs.gitfather_ref }}
          path: engine

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Install engine deps
        run: npm ci
        working-directory: engine

      - name: Read profile (PG_CLIENT_MAJOR for the client install)
        working-directory: engine
        env:
          PROFILE: ${{ github.workspace }}/caller/${{ inputs.profile }}
        run: npx tsx scripts/profile-export.ts >> "$GITHUB_ENV"

      - uses: ./engine/.github/actions/setup-tools
        with:
          pg-client-major: ${{ env.PG_CLIENT_MAJOR }}
          install-age: ${{ env.ENCRYPTION == 'age' }}

      - name: Durable verify
        working-directory: engine
        env:
          PROFILE: ${{ github.workspace }}/caller/${{ inputs.profile }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ inputs.r2_bucket }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DRILL_DATABASE_URL: postgres://postgres:drill@localhost:5432/postgres?sslmode=disable
          PG_LIVE_DATABASE_URL: ${{ secrets.PG_BACKUP_DATABASE_URL }}
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
          VERIFY_HEARTBEAT_URL: ${{ secrets.VERIFY_HEARTBEAT_URL }}
          GITFATHER_JOB_ID: ${{ job.check_run_id }}   # names THIS job in the outcome record (the Slack log link)
        run: npx tsx scripts/verify-durable-pg.ts

      # Tell the-gitfather's scheduler this run finished, so it can announce it in Slack. Runs even when
      # an earlier step failed (a setup failure writes no outcome record — the scheduler then reads the
      # failed step from the Actions API). Authenticated by a short-lived GitHub OIDC token: nothing is
      # stored. Never fails the job: if the caller didn't grant `id-token: write` or set the URL, the
      # scheduler's reconcile tick posts the run within ~10 minutes instead.
      - name: Notify the-gitfather scheduler
        if: always()
        timeout-minutes: 2
        env:
          NOTIFY_URL: ${{ inputs.notify_url }}
        run: |
          set -uo pipefail
          if [ -z "${NOTIFY_URL}" ]; then
            echo "::notice::notify_url not set — the scheduler posts this run on its next reconcile tick"; exit 0
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::caller did not grant id-token: write — the scheduler posts this run on its next reconcile tick"; exit 0
          fi
          jwt=$(curl -fsS --max-time 10 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=the-gitfather" | jq -r '.value // empty') || jwt=""
          if [ -z "${jwt}" ]; then
            echo "::warning::could not mint an OIDC token — the scheduler posts this run on its next reconcile tick"; exit 0
          fi
          echo "::add-mask::${jwt}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-all-errors \
                 -X POST -H "Authorization: Bearer ${jwt}" "${NOTIFY_URL}") || code="curl-failed"
          echo "scheduler /notify → ${code}"
          case "${code}" in 2??) ;; *) echo "::warning::notify returned ${code} — the scheduler posts this run on its next reconcile tick" ;; esac
          exit 0
