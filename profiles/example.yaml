# ─────────────────────────────────────────────────────────────────────────────
# the-gitfather — example profile (copy this into your OWN repo and edit)
#
# A profile holds everything project-specific; the actual DB/R2 *credentials* come
# from the environment (GitHub secrets), never from here. Loaded by the scripts via
# $PROFILE, e.g.:
#
#   PROFILE=profiles/example.yaml npx tsx scripts/backup-pg-to-r2.ts
#
# In CI you keep this file in your consuming repo and point the caller workflow's
# `profile:` input at it (see docs/wiring-a-consuming-repo.md).
#
# Keys are kebab-case. Every task validates this file (zod) at startup and fails fast
# with one aggregated report naming any missing/malformed field. To check a freshly-wired
# consumer end-to-end (config + live R2/Postgres/Slack/gh probes, read-only):
#
#   PROFILE=profiles/example.yaml npm run doctor -- all
#
# Credentials expected in the environment (NOT set here):
#   PG_BACKUP_DATABASE_URL   postgres://USER:PW@HOST:5432/DB?sslmode=require
#                            (use a DIRECT / session-mode endpoint — NOT a transaction-mode pooler like
#                             PgBouncer on :6432; pg_dump needs the direct endpoint, usually :5432)
#   R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
#   DRILL_DATABASE_URL / PG_LIVE_DATABASE_URL   (restore-drill / durable-verify)
#   SLACK_BOT_TOKEN          (optional) xoxb-… (scope chat:write) — enables the daily Slack row
#   HEARTBEAT_URL            (optional) dead-man's-switch ping hit on success
#   ALERT_WEBHOOK_URL        (optional) generic failure webhook
#   AGE_RECIPIENT / AGE_IDENTITY   (only if encryption: age)
#   PG_ARCHIVE_DATABASE_URL  (archive, optional) — the archiver is the only task that DELETES
#   AGE_ARCHIVE_RECIPIENT    (archive, optional) — the age PUBLIC key; its identity stays OFFLINE
# ─────────────────────────────────────────────────────────────────────────────

# Object-key layout: <backup-prefix>/<tier>/<name>-<stamp>.<ext>
name: example                  # db shortname → R2 key basename + Slack header
backup-prefix: pg/example      # R2 object-key prefix
timezone: UTC                  # IANA tz for the dashboard + Slack row (day boundary, HH:MM, abbrev)
encryption: none               # none | age | aes-gcm  (age = client-side; needs AGE_RECIPIENT)
# expect-recipient: age1…      # OPTIONAL but recommended with `encryption: age`: the recipient
                               # AGE_RECIPIENT must equal, pinned here in git. An age header carries
                               # an ephemeral share, NOT the recipient's public key, so nothing can
                               # tell you afterwards what an object was encrypted to — a silently
                               # rotated secret produces a bucket of objects nobody can open, and
                               # the first sign is a failed decrypt months later. A public key is
                               # not a secret; this is the only keyless guard there is.
anchor-hour-utc: 16            # the 8-hourly run at this UTC hour is also promoted to daily/weekly/monthly

dump:
  flags: "-Fc --no-owner --no-privileges"  # full custom-format dump, restorable without source roles
  client-major: 17             # Postgres client major — must be >= the server you dump
  min-bytes: 1048576           # abort (don't upload) below this; also staleness's fresh-but-broken floor

integrity:                     # backup-time integrity checks
  # The dump is written as PLAINTEXT first and encrypted afterwards, so both checks below read it
  # with no decrypt key involved — whatever `encryption:` says. That ordering is the whole reason
  # AGE_IDENTITY does not need to exist in the backup job, or in CI at all.
  checksum: true               # record a SHA-256 of the uploaded object (the durable hash-verify baseline)
  check-structure: true        # pg_restore -l TOC check on the plaintext, before it is encrypted
  verify-before-encrypt: false # opt-in: full pg_restore + drill row-checks of the plaintext, into
                               # `drill-database-url`, on EVERY run. The strongest proof available
                               # and it needs no key; costs one restore per run. Requires
                               # drill.row-count-table + DRILL_DATABASE_URL.
  verify-after-upload: false   # opt-in: re-download + (decrypt) + pg_restore -l. Needs AGE_IDENTITY
                               # under `encryption: age`, so prefer verify-before-encrypt.

archive:                       # OPTIONAL — archive-table.ts. Move old rows of an append-only table
                               # OUT of Postgres into per-week objects, then delete them from the source.
                               # Omit this block entirely if you don't archive anything.
  store-prefix: archive/example  # object-key prefix, a SIBLING of backup-prefix. Give it its own R2
                               #   lifecycle rule (NO expiry — that is what makes archives permanent)
                               #   and its own bucket lock. Remember locks outrank lifecycle.
  encryption: age              # none | age. NOT the same recipient as the dumps: this uses
                               #   AGE_ARCHIVE_RECIPIENT, whose identity is meant to live OFFLINE, so a
                               #   leaked CI credential cannot read the archive. Nothing in CI needs to
                               #   decrypt — verification is hash + fingerprint based.
  compression: zstd            # zstd | gzip | none. Applied BEFORE encryption.
  compression-level: 12        # 1..19 for zstd (clamped to 9 for gzip)
  tables:
    - table: public.api_logs
      time-column: created_at  # must be NOT NULL and indexed; weeks are ISO-8601 on UTC boundaries
      archive-after-weeks: 4   # a week is eligible only once its LAST row is this old
      prune-after-weeks: 13    # >= archive-after-weeks. Deliberately LONGER here: archiving from 4
                               #   weeks keeps the pipeline exercised weekly (rather than idle until
                               #   the horizon), while the database still answers a quarter of history
                               #   for debugging and for any replay path that reads this table.
                               #   Widening later is free; narrowing deletes more on the next run and
                               #   nothing already deleted comes back — so err wide.
      delete-batch-rows: 2000  # small batches — one huge DELETE floods a realtime publication's slot
      max-weeks-per-run: 1     # the backfill throttle; override per run with --max-weeks

retention:                     # GFS windows as natural-language durations (these are the defaults).
  grandson: 2 days             #   8-hourly (the legacy `2hourly/` key prefix) — every 8 h, kept this long
  son: 3 weeks                 #   daily    — one per day at the anchor hour
  father: 13 weeks             #   weekly   — one per week (Sundays)
  grandfather: 2 years         #   monthly  — one per month (the 1st)
# NOTE: R2 actually deletes objects via bucket lifecycle rules — keep those in sync with these
# values (see docs/r2-setup.md); changing this file does not reconfigure R2.

drill:                         # restore-drill / durable-verify row checks
  row-count-table: your_largest_table   # gated against the live row count (min/max-row-ratio)
  present-tables: []           # these must EXIST in the restore (rows optional)
  nonempty-tables: []          # these must exist AND have ≥1 row
  min-row-ratio: 0.95          # restored/live floor for row-count-table (catches truncation)
  max-row-ratio: 2.0           # restored/live ceiling (catches duplicated/double-restored rows)
  max-row-drop: 0              # 0 = off; else fail if a table shrank > this fraction vs the prior passing drill

verify-durable:                # daily durable-tier verification (verify-durable-pg.ts)
  fresh: true                  # hash-check each new durable object + restore the freshest daily
  aged: true                   # re-restore the newest weekly/monthly ≥ retest-days old
  retest-days: 14              # age at which a weekly/monthly is aged-due (13 to stay inside the WORM lock)
  max-restores: 2              # cap full restores per run (hash-checks uncapped)
  rehash-per-run: 1            # ALSO re-hash the N least-recently-hashed objects each run, so
                               # "the bytes are unchanged" stays a CURRENT claim and not one made
                               # once on first sight. Oldest-first, so the budget lands on the
                               # long-lived tiers by itself. 0 disables.
  rehash-max-age-days: 90      # page if the least-recently-hashed object exceeds this (0 = off).
                               # Roughly 2x your sweep time = objects / rehash-per-run runs.
  drill-max-age-days: 0        # warn when the newest MANUAL drill (drill-object.ts) is older than
                               # this. Set it if you run keyless: that drill is then the ONLY proof
                               # your escrowed identity still opens a stored object.
  keyless: false               # true = hash checks ONLY: no AGE_IDENTITY, no database, no restores.
                               # For a deployment that keeps the identity offline and proves
                               # restorability at BACKUP time (integrity.verify-before-encrypt)
                               # plus a periodic human decrypt drill. Requires `aged: false`, and
                               # REFUSES an AGE_IDENTITY in the environment — a key this job has
                               # declared it cannot use is just a secret nobody is watching.

# Credential-rotation ageing. The rotation date is recorded by roll-r2-token.ts when it publishes —
# that is the only durable trace, since a GitHub secret cannot be read back and listing repository
# secrets needs a token more privileged than the job that would do the checking. Reported daily by
# verify-durable (a Slack note, never a failure — an old token cannot corrupt a backup) and on
# demand by `npm run doctor -- verify-durable`.
credential-rotation:
  max-age-days: 365            # 0 disables. Generous on purpose: this is hygiene, not an incident.
  track: [R2]                  # credential prefixes, matching the env-var names (R2_ACCESS_KEY_ID → R2).
                               # A tracked prefix with NO recorded rotation reports `unknown` — which
                               # is the case this check exists for, so it is reported, not skipped.

staleness:                     # the watchdog — runs in the Cloudflare Worker (scheduler/), every 10 min.
                               # The backup PUBLISHES this block (validated, defaults applied) to
                               # _config/<name>/watchdog.json in the bucket on every run; the Worker
                               # reads it there. An edit here lands with the next backup run.
  slot-minutes: 480            # backup cadence in minutes — MUST match the Worker's backup cadence (00/08/16 UTC = 480)
  grace-minutes: 25            # minutes past a slot boundary before it's "overdue" — trades faster recovery
                               #   (≈ grace + check interval) against redundant heals on scheduler jitter
  max-age-hours: 12            # backstop: page if the newest 2hourly/ object is older than this (slot logic
                               #   is primary). Omit it and it is DERIVED from the cadence (1.5 slots —
                               #   12 h here); a value inside slot-minutes + grace is refused, because a
                               #   backstop that tight pages on every healthy tick.
  repage-minutes: 60           # minutes between LOUD re-pages while an outage persists. The check runs
                               #   far more often than this; entry and any change of CAUSE always page.
                               #   0 = page every tick (the old behaviour). Slack noise only — every
                               #   tick's outcome is still recorded in the scheduler's state/log.
  heal-workflow: pg-backup.yml # the caller workflow (in YOUR repo) self-heal dispatches on a missed slot
  self-heal: true              # false = alert only (never auto-retry)
  dry-run: false               # true = log the trigger, don't fire

slack:                         # optional. The bot token is env: SLACK_BOT_TOKEN (a secret).
  channel: ""                  # channel id (C…) to post in — non-secret, so it may live here. The env
                               #   SLACK_CHANNEL (a GitHub Variable) wins when set. The Worker's watchdog
                               #   posts to this channel too (from the published watchdog config).
  alert-mention: "<!here>"     # prepended to failure alerts (<!here> active members, <!channel> everyone)

dashboard:                     # optional public backup-history dashboard
  label: ""                    # display label; defaults to `name`
  hide-run-links: false        # true = drop GitHub run links from the public page
  url: ""                      # if set, the Slack header's "<name> DB backup" links here
  path-prefix: ""              # object-key prefix in the dashboard bucket: <path-prefix>/<name>/index.html.
                               # "" → <name>/index.html. Set it (e.g. "backups") to share ONE bucket +
                               # custom domain across projects, e.g. https://ops.example.com/backups/<name>/index.html
